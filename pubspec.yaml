name: proyect_mate
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.13.5


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # --- AGREGA ESTAS DOS LÍNEAS AQUÍ ---
  sqflite: ^2.3.0    # O la versión más reciente compatible
  path: ^1.8.3       # Necesario para ubicar la ruta de la base de datos en el celular

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  # Agrega esta sección de assets para incluir tu base de datos
  assets:
    - assets/db/base_de_datos_parqueadero_v2.db
